# This must exactly match one profile name. Display names can also be changed
# in this advanced config file.
default = "Qwen"

# Each entry is one actual model runtime, not one quantization preset. Keep the
# service names model-agnostic; its ExecStart points at the downloaded GGUF file
# and owns that model's context, cache, GPU, and optional draft-model settings.
[[profiles]]
name = "Qwen"
service = "omarchy-local-ai-runtime-1.service"
# summary = "Optional human-readable description"
# endpoint = "http://127.0.0.1:8080/v1"

[[profiles]]
name = "Gemma"
service = "omarchy-local-ai-runtime-2.service"

[[profiles]]
name = "Vision"
service = "omarchy-local-ai-runtime-3.service"

# The optional always-on Assistant uses a lightweight local model. These
# settings live in the same file as the runtime index, but remain an independent
# subsystem: enabling the Assistant never starts a heavyweight runtime profile.
[assistant.runtime]
endpoint = "http://127.0.0.1:8080/v1"
model = "auto"
context_window = 65536
max_output_tokens = 512
api_key_env = ""
allow_remote_endpoint = false
startup_timeout_sec = 60
start_command = []

[assistant.observer]
debounce_sec = 5
cooldown_sec = 180
poll_interval_sec = 15
inference_timeout_sec = 30
minimum_confidence = 0.72
suggestion_ttl_sec = 30
max_suggestions_per_hour = 8

[assistant.privacy]
share_window_title = true
blocked_apps = []
deny_apps = ["1password", "bitwarden", "keepassxc", "org.gnome.seahorse"]
deny_title_patterns = ["password", "passcode", "secret", "private key", "banking", "incognito", "private browsing"]

[assistant.delegation]
preferred_harness = "auto"
command = ["pi-worker", "--profile", "inspect", "--thinking", "low", "--no-web", "--text", "--"]
launch_in_terminal = true

[assistant.playbook]
path = "~/.config/omarchy/local-ai-assistant-playbook.json"
